<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Software · Bonanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main><div class="wrap">
<div class="hero" style="padding-bottom:8px"><h1>Software</h1><p class="lead" style="margin:0">Everything published here, by category.</p></div>
<div id="cats"></div>
</div>
<div style="height:24px"></div></main>
<script src="/assets/site.js"></script>
<script>
BQ.apps.then(function(apps){
  var cats=[];apps.forEach(function(a){if(cats.indexOf(a.category)<0)cats.push(a.category)});
  var h='';
  cats.forEach(function(c){
    h+='<div class="grp"><h3>'+BQ.esc(c)+'</h3></div><div class="grid">'+apps.filter(function(a){return a.category===c}).map(BQ.card).join('')+'</div>';
  });
  var box=document.getElementById('cats');box.innerHTML=h;BQ.fill(box);
});
</script>
</body>
</html>
