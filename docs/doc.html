<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main><div class="wrap" id="app"></div></main>
<script src="/assets/site.js"></script>
<script>
var q=new URLSearchParams(location.search),id=q.get('app'),doc=q.get('doc'),root=document.getElementById('app');
BQ.apps.then(function(list){
  var a=list.filter(function(x){return x.id===id&&x.repo})[0];
  if(!a||!doc){root.innerHTML='<div class="panel" style="margin-top:64px"><h2>Page not found</h2><p><a href="/software.html" class="btn sm">All software</a></p></div>';return}
  root.innerHTML='<div class="crumb"><a href="/software.html">Software</a> / <a href="/app.html?app='+a.id+'">'+BQ.esc(a.name)+'</a></div><div class="panel doc" style="margin-top:20px" id="d">Loading...</div>';
  BQ.raw(a,doc+'.md').then(function(md){return BQ.render(md,a)}).then(function(h){
    var d=document.getElementById('d');d.innerHTML=h;var t=d.querySelector('h1');if(t)document.title=t.textContent+' · '+a.name;
  }).catch(function(){document.getElementById('d').innerHTML='<h2>Page not found</h2><p>This document could not be loaded.</p>'});
});
</script>
</body>
</html>
