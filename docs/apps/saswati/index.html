<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main><div class="wrap" id="app"></div></main>
<script src="/assets/site.js"></script>
<script>
var id=BQ.route().app,root=document.getElementById('app');
BQ.apps.then(function(list){
  var a=list.filter(function(x){return x.id===id&&x.status!=='soon'})[0];
  if(!a){root.innerHTML='<div class="panel" style="margin-top:64px"><h2>App not found</h2><p><a href="/software.html" class="btn sm">All software</a></p></div>';return}
  document.title=a.name+' · Bonanto';
  var licUrl=BQ.u.doc(a.id,'license');
  function licTag(t){return '<a class="tag" title="View licence" href="'+licUrl+'">Licence: '+BQ.esc(t)+'</a>'}
  var tags=(a.price?'<span class="tag k">'+BQ.esc(a.price)+'</span>':'')
    +(a.platforms||[]).map(function(p){return '<span class="tag">'+BQ.esc(p)+'</span>'}).join('')+(a.license?licTag(a.license):'')+(a.repo?'<a class="tag" href="https://github.com/'+a.repo+'" target="_blank" rel="noopener">View on GitHub ↗</a>':'');
  var btns=(a.repo?'<a class="btn primary" id="dl" href="https://github.com/'+a.repo+'/releases/latest">Download Latest Version</a><a class="btn" href="'+BQ.u.ver(a.id)+'">Version History</a>':'')
    +(a.store?'<a class="btn" href="'+BQ.esc(a.store)+'">Microsoft Store</a>':'')
    +(a.links||[]).map(function(l){return '<a class="btn" href="'+BQ.esc(l.href)+'">'+BQ.esc(l.label)+'</a>'}).join('');
  root.innerHTML='<div class="crumb"><a href="/software.html">Software</a> / '+BQ.esc(a.name)+'</div>'
    +'<div class="app-head" style="padding-top:20px">'+BQ.icon(a,'lg')+'<div><h1>'+BQ.esc(a.name)+'</h1><p class="lead">'+BQ.esc(a.tagline)+'</p><div class="tags" id="tg">'+tags+'</div></div></div>'
    +'<div class="btns" style="margin-bottom:28px;align-items:center">'+btns+'<div class="stats" id="st"></div></div>'
    +'<div class="shots" id="shots" hidden></div><div class="panel doc" id="about" hidden></div>'
    +(a.data&&a.data.length?'<div class="panel"><h2>Data and privacy</h2><ul class="chk">'+a.data.map(function(d){return '<li>'+BQ.esc(d)+'</li>'}).join('')+'</ul></div>':'')
    +'<div class="panel" id="docs" hidden><h2>Documents</h2><div class="btns" id="dlist"></div></div>'
    +'<div class="panel"><h2>Details</h2><dl>'
    +'<dt>Platforms</dt><dd>'+BQ.esc((a.platforms||[]).join(', ')||'-')+'</dd>'
    +'<dt>Price</dt><dd>'+BQ.esc(a.price||'-')+'</dd>'
    +'<dt>Licence</dt><dd id="lic2">'+(a.license?'<a href="'+licUrl+'" style="text-decoration:underline">'+BQ.esc(a.license)+'</a>':'-')+'</dd>'
    +'<dt>Languages</dt><dd id="lang">'+BQ.esc((a.languages||[]).join(', ')||'-')+'</dd>'
    +'<dt>Latest version</dt><dd id="ver">-</dd><dt>Released</dt><dd id="rd">-</dd>'
    +(a.source?'<dt>Source code</dt><dd><a href="https://github.com/'+a.repo+'" style="text-decoration:underline">github.com/'+a.repo+'</a></dd>':'')
    +'</dl></div>';
  var about=document.getElementById('about'),tg=document.getElementById('tg');

  function fallback(){if(a.about&&a.about.length){about.innerHTML='<h2>About</h2>'+a.about.map(function(p){return '<p>'+BQ.esc(p)+'</p>'}).join('');about.hidden=false}}
  function gallery(){
    if(a.screenshots&&a.screenshots.length){
      var s=BQ.src(a,'readme'),raw='https://raw.githubusercontent.com/'+s.repo+'/'+s.ref+'/'+s.dir;
      return a.screenshots.map(function(u){return{u:/^https?:/.test(u)?u:raw+u.replace(/^\.?\//,''),c:''}});
    }
    var out=[];
    about.querySelectorAll('img').forEach(function(i){
      var f=i.closest('figure'),fc=f&&f.querySelector('figcaption');
      out.push({u:i.src,c:fc?fc.innerText.trim():(i.alt||''),el:i,fig:f});
    });
    if(!a.keepImages){
      out.forEach(function(x){
        var i=x.el,host=i.closest('p,div'),node=i.closest('a')||i;
        if(!x.fig&&host&&host!==about&&host.querySelectorAll('img').length===1){
          var tx=host.textContent.trim();
          if(tx.length<120){if(tx)x.c=tx;node=host}
        }
        function isCap(e,next){
          if(!e||e.querySelector('img,a,table,pre'))return false;
          var t=e.textContent.trim(),w=e.firstElementChild;
          return !!t&&t.length<100&&((next&&e.getAttribute('align')==='center')||/^(H4|H5|H6|FIGCAPTION)$/.test(e.tagName)||(w&&/^(EM|I|SUB|SMALL|STRONG|B)$/.test(w.tagName)&&w.textContent.trim()===t));
        }
        if(!x.fig){
          var nx=node.nextElementSibling,pv=node.previousElementSibling;
          if(isCap(nx,true)){x.c=x.c||nx.textContent.trim();nx.remove()}
          if(isCap(pv,false)){x.c=x.c||pv.textContent.trim();pv.remove()}
        }
        var par=node.parentElement;
        node.remove();
        if(!x.fig&&par&&par!==about&&/^(P|DIV|CENTER|SPAN)$/.test(par.tagName)&&!par.querySelector('img,a,table,pre,ul,ol,h1,h2,h3')&&par.textContent.trim().length<100){x.c=x.c||par.textContent.trim();par.remove()}
        if(x.fig&&!x.fig.querySelector('img'))x.fig.remove();
      });
      for(var k=0;k<3;k++)about.querySelectorAll('p,div,a,figure,span').forEach(function(e){if(!e.textContent.trim()&&!e.querySelector('img,video,iframe,svg'))e.remove()});
    }
    return out;
  }
  function hideTexts(){
    (a.hideText||[]).forEach(function(s){
      about.querySelectorAll('*').forEach(function(e){
        if(e!==about&&e.textContent.trim()===s&&!e.querySelector('img')&&(!e.parentElement||e.parentElement===about||e.parentElement.textContent.trim()!==s))e.remove();
      });
    });
  }
  function shots(list){
    var box=document.getElementById('shots');
    box.innerHTML='<button class="nav l" aria-label="Previous">‹</button><div class="track">'+list.map(function(x){
      return '<figure><img src="'+BQ.esc(x.u)+'" alt="'+BQ.esc(x.c)+'" referrerpolicy="no-referrer">'+(x.c?'<figcaption>'+BQ.esc(x.c)+'</figcaption>':'')+'</figure>';
    }).join('')+'</div><button class="nav r" aria-label="Next">›</button>';
    var tr=box.querySelector('.track');
    box.querySelector('.l').onclick=function(){tr.scrollBy({left:-tr.clientWidth*.8,behavior:'smooth'})};
    box.querySelector('.r').onclick=function(){tr.scrollBy({left:tr.clientWidth*.8,behavior:'smooth'})};
    tr.onclick=function(e){
      if(e.target.tagName!=='IMG')return;
      var lb=document.createElement('div');lb.className='lb';lb.innerHTML='<img src="'+e.target.src+'" alt="">';
      lb.onclick=function(){lb.remove()};document.body.appendChild(lb);
    };
    box.hidden=false;
  }
  if(a.repo)BQ.readme(a).then(function(md){return BQ.render(md,a,{k:'readme',readme:true})}).then(function(h){
    about.innerHTML=h;about.hidden=false;
    var l=gallery();hideTexts();if(l.length)shots(l);
    if(!about.textContent.trim()&&!about.querySelector('img'))about.hidden=true;
  }).catch(fallback);else fallback();
  if(a.repo)BQ.docs(a).then(function(d){
    if(!d.length)return;
    document.getElementById('dlist').innerHTML=d.map(function(x){return '<a class="btn sm" href="'+BQ.u.doc(a.id,x.path)+'">'+BQ.esc(x.label)+'</a>'}).join('');
    document.getElementById('docs').hidden=false;
  }).catch(function(){});
  if(!a.repo)return;
  BQ.stats(a.repo).then(function(s){
    var t='';if(s.stars)t+='<span>★ <b>'+BQ.fmt(s.stars)+'</b></span>';if(s.downloads)t+='<span>↓ <b>'+BQ.fmt(s.downloads)+'</b> downloads</span>';
    document.getElementById('st').innerHTML=t;
    if(!a.license&&s.license){
      tg.insertAdjacentHTML('beforeend',licTag(s.license));
      document.getElementById('lic2').innerHTML='<a href="'+licUrl+'" style="text-decoration:underline">'+BQ.esc(s.license)+'</a>';
    }
  }).catch(function(){});
  BQ.rel(a.repo).then(function(rs){
    rs=BQ.stable(rs);if(!rs.length)return;
    var r=rs[0],as=r.assets||[],pick=(a.asset&&as.filter(function(x){return x.name.indexOf(a.asset)>-1})[0])||as[0],dl=document.getElementById('dl'),v=BQ.ver(r.tag_name),b=BQ.build(r.tag_name);
    if(pick)dl.href=pick.browser_download_url;
    dl.textContent='Download Latest Version ('+v+')';
    document.getElementById('ver').textContent=v+(b?' (build '+b+')':'');
    document.getElementById('rd').textContent=BQ.date(r.published_at);
    tg.insertAdjacentHTML('beforeend','<a class="tag" title="Version history" href="'+BQ.u.ver(a.id)+'">v'+BQ.esc(v)+'</a>'+(b?'<span class="tag">Build '+BQ.esc(b)+'</span>':''));
  }).catch(function(){});
  if(!(a.languages&&a.languages.length))BQ.cached('https://api.github.com/repos/'+a.repo+'/languages',864e5).then(function(l){
    var tot=0,k;for(k in l)tot+=l[k];
    var t=Object.keys(l).sort(function(x,y){return l[y]-l[x]}).map(function(k){return[k,Math.round(l[k]*100/tot)]}).filter(function(x){return x[1]>=1}).map(function(x){return x[0]+' '+x[1]+'%'}).join(', ');
    if(t)document.getElementById('lang').textContent=t;
  }).catch(function(){});
});
</script>
</body>
</html>
