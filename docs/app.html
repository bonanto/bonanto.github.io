<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main><div class="wrap" id="app"></div></main>
<script src="/assets/site.js"></script>
<script>
var id=new URLSearchParams(location.search).get('app'),root=document.getElementById('app');
BQ.apps.then(function(list){
  var a=list.filter(function(x){return x.id===id&&x.status!=='soon'})[0];
  if(!a){root.innerHTML='<div class="panel" style="margin-top:64px"><h2>App not found</h2><p><a href="/software.html" class="btn sm">All software</a></p></div>';return}
  document.title=a.name+' · Bonanto';
  var tags=(a.price?'<span class="tag k">'+BQ.esc(a.price)+'</span>':'')+(a.license?'<span class="tag">'+BQ.esc(a.license)+'</span>':'')
    +(a.platforms||[]).map(function(p){return '<span class="tag">'+BQ.esc(p)+'</span>'}).join('');
  var btns=(a.repo?'<a class="btn primary" id="dl" href="https://github.com/'+a.repo+'/releases/latest">Download Latest Version</a><a class="btn" href="/versions.html?app='+a.id+'">Version History</a>':'')
    +(a.store?'<a class="btn" href="'+BQ.esc(a.store)+'">Microsoft Store</a>':'')
    +(a.links||[]).map(function(l){return '<a class="btn" href="'+BQ.esc(l.href)+'">'+BQ.esc(l.label)+'</a>'}).join('');
  root.innerHTML='<div class="crumb"><a href="/software.html">Software</a> / '+BQ.esc(a.name)+'</div>'
    +'<div class="app-head" style="padding-top:20px">'+BQ.icon(a,'lg')+'<div><h1>'+BQ.esc(a.name)+'</h1><p class="lead">'+BQ.esc(a.tagline)+'</p><div class="tags">'+tags+'</div></div></div>'
    +'<div class="btns" style="margin-bottom:28px;align-items:center">'+btns+'<div class="stats" id="st"></div></div>'
    +'<div class="shots" id="shots" hidden></div><div class="panel doc" id="about" hidden></div>'
    +(a.data&&a.data.length?'<div class="panel"><h2>Data and privacy</h2><ul class="chk">'+a.data.map(function(d){return '<li>'+BQ.esc(d)+'</li>'}).join('')+'</ul></div>':'')
    +'<div class="panel" id="docs" hidden><h2>Documents</h2><div class="btns" id="dlist"></div></div>'
    +'<div class="panel"><h2>Details</h2><dl>'
    +'<dt>Platforms</dt><dd>'+BQ.esc((a.platforms||[]).join(', ')||'-')+'</dd>'
    +'<dt>Price</dt><dd>'+BQ.esc(a.price||'-')+'</dd>'
    +(a.license?'<dt>Licence</dt><dd>'+BQ.esc(a.license)+'</dd>':'')
    +'<dt>Languages</dt><dd id="lang">'+BQ.esc((a.languages||[]).join(', ')||'-')+'</dd>'
    +'<dt>Latest version</dt><dd id="ver">-</dd><dt>Released</dt><dd id="rd">-</dd>'
    +(a.source?'<dt>Source code</dt><dd><a href="https://github.com/'+a.repo+'" style="text-decoration:underline">github.com/'+a.repo+'</a></dd>':'')
    +'</dl></div>';
  var about=document.getElementById('about');
  function fallback(){if(a.about&&a.about.length){about.className='panel doc';about.innerHTML='<h2>About</h2>'+a.about.map(function(p){return '<p>'+BQ.esc(p)+'</p>'}).join('');about.hidden=false}}
  function gallery(){
    var s=BQ.src(a),raw='https://raw.githubusercontent.com/'+s.repo+'/'+s.ref+'/'+s.dir;
    if(a.screenshots&&a.screenshots.length)return Promise.resolve(a.screenshots.map(function(u){return /^https?:/.test(u)?u:raw+u.replace(/^\.?\//,'')}));
    var imgs=[].slice.call(about.querySelectorAll('img')).filter(function(i){return !/shields\.io|badge|\.svg(\?|$)|workflows/i.test(i.src)});
    return Promise.all(imgs.map(function(i){return new Promise(function(res){var m=new Image();m.onload=function(){res({i:i,w:m.naturalWidth,h:m.naturalHeight})};m.onerror=function(){res(null)};m.src=i.src})})).then(function(r){
      var keep=[];
      r.forEach(function(x){
        if(!x)return;
        var sq=Math.abs(x.w/x.h-1)<.1&&x.w<=700;
        if(sq||x.w>=300){(x.i.closest('a')||x.i).remove()}
        if(!sq&&x.w>=300)keep.push(x.i.src);
      });
      about.querySelectorAll('p,div,a').forEach(function(e){if(!e.textContent.trim()&&!e.querySelector('img'))e.remove()});
      return keep;
    });
  }
  function shots(list){
    var box=document.getElementById('shots');
    box.innerHTML='<button class="nav l" aria-label="Previous">‹</button><div class="track">'+list.map(function(u){return '<img src="'+BQ.esc(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer">'}).join('')+'</div><button class="nav r" aria-label="Next">›</button>';
    var tr=box.querySelector('.track');
    box.querySelector('.l').onclick=function(){tr.scrollBy({left:-tr.clientWidth*.8,behavior:'smooth'})};
    box.querySelector('.r').onclick=function(){tr.scrollBy({left:tr.clientWidth*.8,behavior:'smooth'})};
    tr.onclick=function(e){
      if(e.target.tagName!=='IMG')return;
      var lb=document.createElement('div');lb.className='lb';lb.innerHTML='<img src="'+e.target.src+'" alt="">';
      lb.onclick=function(){lb.remove()};document.body.appendChild(lb);
    };
    box.hidden=false;
  }
  if(a.repo)BQ.readme(a).then(function(md){return BQ.render(md,a)}).then(function(h){
    about.innerHTML=h;var h1=about.querySelector('h1');if(h1)h1.remove();about.hidden=false;
    return gallery();
  }).then(function(list){
    if(list&&list.length)shots(list);
    if(!about.textContent.trim())about.hidden=true;
  }).catch(fallback);else fallback();
  if(a.repo)BQ.docs(a).then(function(d){
    if(!d.length)return;
    document.getElementById('dlist').innerHTML=d.map(function(x){return '<a class="btn sm" href="/doc.html?app='+a.id+'&doc='+encodeURIComponent(x.path)+'">'+BQ.esc(x.label)+'</a>'}).join('');
    document.getElementById('docs').hidden=false;
  }).catch(function(){});
  if(!a.repo)return;
  BQ.stats(a.repo).then(function(s){
    var t='';if(a.source&&s.stars)t+='<span>★ <b>'+BQ.fmt(s.stars)+'</b></span>';if(s.downloads)t+='<span>↓ <b>'+BQ.fmt(s.downloads)+'</b> downloads</span>';
    document.getElementById('st').innerHTML=t;
  }).catch(function(){});
  BQ.rel(a.repo).then(function(rs){
    rs=BQ.stable(rs);if(!rs.length)return;
    var r=rs[0],as=r.assets||[],pick=(a.asset&&as.filter(function(x){return x.name.indexOf(a.asset)>-1})[0])||as[0],dl=document.getElementById('dl');
    if(pick)dl.href=pick.browser_download_url;
    dl.textContent='Download Latest Version ('+BQ.ver(r.tag_name)+')';
    document.getElementById('ver').textContent=BQ.ver(r.tag_name);
    document.getElementById('rd').textContent=BQ.date(r.published_at);
  }).catch(function(){});
  if(!(a.languages&&a.languages.length))BQ.cached('https://api.github.com/repos/'+a.repo+'/languages',864e5).then(function(l){
    var tot=0,k;for(k in l)tot+=l[k];
    var t=Object.keys(l).sort(function(x,y){return l[y]-l[x]}).map(function(k){return[k,Math.round(l[k]*100/tot)]}).filter(function(x){return x[1]>=1}).map(function(x){return x[0]+' '+x[1]+'%'}).join(', ');
    if(t)document.getElementById('lang').textContent=t;
  }).catch(function(){});
});
</script>
</body>
</html>
